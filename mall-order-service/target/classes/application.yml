server:
  port: 8083

spring:
  application:
    name: mall-order-service
  cloud:
    nacos:
      discovery:
        server-addr: 100.121.74.115:8848 # 必须加上这个，覆盖掉 127.0.0.1 的默认值
      config:
        server-addr: 100.121.74.115:8848 # 如果你用到了Nacos配置中心，也加上
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://100.121.74.115:3306/db_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      maximum-pool-size: 50
rocketmq:
  name-server: 100.120.228.17:9876 # 保持和商品服务一致
  producer:
    group: audit-log-producer-group
    send-message-timeout: 3000

# 审计日志配置 (简历亮点：支持动态配置全局异步MQ解耦 vs 同步落库)
audit:
  delivery-mode: ASYNC_MQ # 全局默认投递模式：ASYNC_MQ / SYNC_DB
  rocketmq:
    topic: audit-log-topic
    tag: log

seata:
  # 1. 解决 vgroupMapping 报错：定义事务分组并映射到默认集群
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default # 将 default_tx_group 映射到服务端的 default 集群
    grouplist:
      default: 100.121.74.115:8091
  registry:
    type: file
dubbo:
  application:
    name: mall-order-service
    register-mode: interface
  registry:
    address: nacos://100.121.74.115:8848/
xxl:
  job:
    admin:
      # 这里使用你提供的 IP 和 8090 端口
      addresses: http://100.121.74.115:8090/xxl-job-admin
    executor:
      # 执行器名称，稍后要在 XXL-Job 后台配置这个名字
      appname: mall-order-executor
      # 执行器端口（订单服务与 XXL-Job 通信的端口，默认 9999）
      port: 9999
      logpath: ./logs/xxl-job/jobhandler
      logretentiondays: 30
    accessToken: default_token
