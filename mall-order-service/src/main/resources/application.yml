server:
  port: 8083

spring:
  application:
    name: mall-order-service
  cloud:
    nacos:
      discovery:
        server-addr: 100.121.74.115:8848 # 必须加上这个，覆盖掉 127.0.0.1 的默认值
      config:
        server-addr: 100.121.74.115:8848 # 如果你用到了Nacos配置中心，也加上
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://100.121.74.115:3306/db_order?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      maximum-pool-size: 50
  data:
    redis:
      host: ${REDIS_HOST:100.121.74.115}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:tsy347}
rocketmq:
  name-server: 100.120.228.17:9876 # 保持和商品服务一致
  producer:
    group: audit-log-producer-group
    send-message-timeout: 3000

trade:
  order:
    fee-rate-percent: ${TRADE_FEE_RATE_PERCENT:2}
    min-fee: ${TRADE_MIN_FEE:0.01}
    payment-expire-minutes: ${TRADE_PAYMENT_EXPIRE_MINUTES:15}
    delivery-timeout-minutes: ${TRADE_DELIVERY_TIMEOUT_MINUTES:30}
    auto-confirm-hours: ${TRADE_AUTO_CONFIRM_HOURS:24}
    settle-cooldown-hours: ${TRADE_SETTLE_COOLDOWN_HOURS:24}
  payment-callback:
    secret: ${PAYMENT_CALLBACK_SECRET}
    secret-version: ${PAYMENT_CALLBACK_SECRET_VERSION:1}
    clock-skew-seconds: ${PAYMENT_CALLBACK_CLOCK_SKEW_SECONDS:300}
    nonce-ttl-seconds: ${PAYMENT_CALLBACK_NONCE_TTL_SECONDS:900}
    mock-enabled: ${PAYMENT_MOCK_ENABLED:false}
  orchestration:
    enabled: ${TRADE_ORCHESTRATION_ENABLED:true}
    recover-batch-size: ${TRADE_ORCHESTRATION_RECOVER_BATCH_SIZE:100}
    lock-seconds: ${TRADE_ORCHESTRATION_LOCK_SECONDS:60}
    max-retry-count: ${TRADE_ORCHESTRATION_MAX_RETRY_COUNT:5}
    retry-delay-seconds: ${TRADE_ORCHESTRATION_RETRY_DELAY_SECONDS:30}
    topic: ${TRADE_ORCHESTRATION_TOPIC:trade-orchestration-task-topic}
    delivery-timeout-minutes: ${TRADE_DELIVERY_TIMEOUT_MINUTES:30}
    payment-expire-minutes: ${TRADE_PAYMENT_EXPIRE_MINUTES:15}
    fee-rate-percent: ${TRADE_FEE_RATE_PERCENT:2}
    min-fee: ${TRADE_MIN_FEE:0.01}
  reconciliation:
    interrupted-minutes: ${TRADE_RECONCILIATION_INTERRUPTED_MINUTES:10}

# 审计日志配置 (简历亮点：支持动态配置全局异步MQ解耦 vs 同步落库)
audit:
  delivery-mode: ASYNC_MQ # 全局默认投递模式：ASYNC_MQ / SYNC_DB
  rocketmq:
    topic: audit-log-topic
    tag: log

seata:
  # 1. 解决 vgroupMapping 报错：定义事务分组并映射到默认集群
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default # 将 default_tx_group 映射到服务端的 default 集群
    grouplist:
      default: 100.121.74.115:8091
  registry:
    type: file
dubbo:
  application:
    name: mall-order-service
    register-mode: interface
    qos-port: 22223
    service-discovery:
      migration: FORCE_INTERFACE
  registry:
    address: nacos://100.121.74.115:8848/
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://100.121.74.115:8090/xxl-job-admin}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:mall-order-executor}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ${XXL_JOB_LOG_PATH:./logs/xxl-job/jobhandler}
      logretentiondays: ${XXL_JOB_LOG_RETENTION_DAYS:30}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        database.sql.duration.seconds: true

pagination:
  default-page-size: 20
  max-page-size: 100

performance:
  slow-sql-threshold-ms: ${SLOW_SQL_THRESHOLD_MS:500}
