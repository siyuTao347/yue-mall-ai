server:
  port: 8084

spring:
  application:
    name: mall-risk-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://100.121.74.115:3306/db_risk?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:100.121.74.115:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:100.121.74.115:8848}

rocketmq:
  name-server: 100.120.228.17:9876
  producer:
    group: risk-command-producer-group

risk:
  identity-salt: change-me-in-production
  precheck-expire-minutes: 10
  indicator:
    materialized-enabled: ${RISK_INDICATOR_MATERIALIZED_ENABLED:false}
    query-budget: ${RISK_INDICATOR_QUERY_BUDGET:3}
    refresh-batch-size: ${RISK_INDICATOR_REFRESH_BATCH_SIZE:100}

dubbo:
  application:
    name: mall-risk-service
    register-mode: interface
    qos-port: 22224
  registry:
    address: nacos://100.121.74.115:8848/
  protocol:
    name: dubbo
    port: 20884
  scan:
    base-packages: com.example.risk.provider
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://100.121.74.115:8090/xxl-job-admin}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:mall-risk-executor}
      port: ${XXL_JOB_EXECUTOR_PORT:9998}
      logpath: ${XXL_JOB_LOG_PATH:./logs/xxl-job/jobhandler}
      logretentiondays: ${XXL_JOB_LOG_RETENTION_DAYS:30}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        database.sql.duration.seconds: true
        risk.evaluate.duration.seconds: true
        risk.indicator.refresh.duration.seconds: true
        risk.indicator.refresh.lag.seconds: true

pagination:
  default-page-size: 20
  max-page-size: 100

performance:
  slow-sql-threshold-ms: ${SLOW_SQL_THRESHOLD_MS:500}
