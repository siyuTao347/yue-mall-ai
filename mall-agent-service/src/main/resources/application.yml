server:
  port: 8085

spring:
  application:
    name: mall-agent-service
  # 主数据源：MySQL db_agent（RAG 元数据权威源，MyBatis-Plus 使用）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${AGENT_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/db_agent?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${AGENT_MYSQL_USERNAME:root}
    password: ${AGENT_MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 200ms
      timeout: 200ms
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

rag:
  # 向量数据源：PostgreSQL + pgvector（派生数据，不参与 MySQL 事务）
  pgvector:
    datasource:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://${AGENT_PGVECTOR_HOST:127.0.0.1}:${AGENT_PGVECTOR_PORT:5432}/${AGENT_PGVECTOR_DATABASE:postgres}?ApplicationName=mall-agent-rag&connectTimeout=3&socketTimeout=10
      username: ${AGENT_PGVECTOR_USERNAME:root}
      password: ${PGVECTOR_PASSWORD:}
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 10000
      pool-name: rag-vector-pool
    embedding-dim: 1536
    index:
      hnsw-m: 16
      hnsw-ef-construction: 64
      search-ef: 100
  embedding:
    provider: ${RAG_EMBEDDING_PROVIDER:OPENAI_COMPATIBLE}     # MOCK | OPENAI_COMPATIBLE
    model: ${RAG_EMBEDDING_MODEL:qwen3.7-text-embedding}
    dim: ${RAG_EMBEDDING_DIM:1536}
    batch-size: 32
    timeout-ms: 8000
    max-text-chars: 8000
    base-url: ${RAG_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${RAG_EMBEDDING_API_KEY:}
  chunk:
    splitter-version: v1
    keyword-limit: 32
    parent:
      target-chars: 1000
      max-chars: 1600
      min-chars: 400
      embed-enabled: false
    child:
      target-chars: 320
      max-chars: 450
      min-chars: 80
      overlap-chars: 60
      max-per-parent: 8
  retrieval:
    default-mode: ${RAG_RETRIEVAL_MODE:HYBRID}
    fallback-enabled: true
    child-top-k: 20
    parent-top-n: 5
    rrf-k: 60
    max-context-chars: 6000
  admin:
    sensitive-action: REJECT

pagination:
  default-page-size: 20
  max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus


# 客服模型和知识库 Embedding 分开配置。默认 MOCK 不调用外部 ChatModel。
customer-service:
  provider: ${CUSTOMER_SERVICE_PROVIDER:MOCK}
  api-key: ${CUSTOMER_SERVICE_API_KEY:}
  base-url: ${CUSTOMER_SERVICE_BASE_URL:https://dashscope.aliyuncs.com}
  master-model: ${CUSTOMER_SERVICE_MASTER_MODEL:qwen3.8-flash}
  response-model: ${CUSTOMER_SERVICE_RESPONSE_MODEL:qwen3.8-flash}
  run-timeout-ms: 90000
  model-timeout-ms: 15000
  retrieval-timeout-ms: 12000
  knowledge-threshold: 0.5 # 初始门槛，需用真实知识评估集校准
  l1-max-chars: 20
  rag-enabled: true
  pre-sale-enabled: ${CUSTOMER_SERVICE_PRE_SALE_ENABLED:true}

# 只读客服 Dubbo consumer；订单提供者未启动不阻止知识库管理服务启动。
dubbo:
  application:
    name: mall-agent-service
    qos-enable: false
    register-mode: interface
    service-discovery:
      migration: FORCE_INTERFACE
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848}
  protocol:
    name: dubbo
    port: -1
  consumer:
    check: false
    timeout: 3000
    retries: 0
